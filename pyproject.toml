[project]
name = "fabula-bench"
version = "0.1.0"
description = "Does a model find what a story is about - its salient concepts - and how its events bring one another about - its plots?"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1,<2",
    "authordoc>=0.1.2",
    "tqdm>=4.66",
    "vramen>=0.2.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
